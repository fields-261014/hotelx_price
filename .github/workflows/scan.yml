name: HoteLux 요금 조회

on:
  schedule:
    - cron: '50 23 * * *'  # 한국 08:50 시작 → Claude 알림 10:00
    - cron: '50 5 * * *'   # 한국 14:50 시작 → Claude 알림 16:00
    - cron: '50 10 * * *'  # 한국 19:50 시작 → Claude 알림 21:00
  workflow_dispatch: {}     # Actions 화면의 'Run workflow' 버튼으로 즉시 실행

permissions:
  contents: write

concurrency:
  group: hotelux-scan
  cancel-in-progress: false

jobs:
  # config.json 의 호텔 목록을 읽어 호텔별 조회 작업을 만든다
  prepare:
    runs-on: ubuntu-latest
    outputs:
      hotels: ${{ steps.list.outputs.hotels }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "hotels=$(node -e "console.log(JSON.stringify(require('./config.json').hotels.map(h=>h.key)))")" >> "$GITHUB_OUTPUT"

  # 호텔마다 서로 다른 서버에서 동시에 조회
  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        hotel: ${{ fromJSON(needs.prepare.outputs.hotels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 브라우저 설치
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: 요금 조회 (${{ matrix.hotel }})
        run: node scan.mjs scan ${{ matrix.hotel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.hotel }}
          path: out/${{ matrix.hotel }}.json
          retention-days: 1
          if-no-files-found: ignore

  # 결과를 합쳐 비교하고, 기록 저장 + 알림
  merge:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: out
          merge-multiple: true
      - name: 비교·알림
        run: node scan.mjs merge
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 결과 저장
        run: |
          git config user.name "hotelux-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data report.md
          git diff --cached --quiet || git commit -m "조회 결과 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
