name: HoteLux 요금 조회

on:
  schedule:
    - cron: '0 0 * * *'    # 한국 09:00 시작 → 약 10:00 알림
    - cron: '20 6 * * *'   # 한국 15:20 시작 → 약 16:20 알림
  workflow_dispatch: {}     # Actions 화면에서 'Run workflow' 버튼으로 즉시 실행

permissions:
  contents: write

concurrency:
  group: hotelux-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 요금 조회
        run: node scan.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 결과 저장
        run: |
          git config user.name "hotelux-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data report.md
          git diff --cached --quiet || git commit -m "조회 결과 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
